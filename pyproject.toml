[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "factory-ai"
version = "0.1.0"
description = "Central bot and swarm creation engine for the AllBots ecosystem"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
aws   = ["boto3>=1.34"]
azure = ["azure-mgmt-web>=7.0", "azure-identity>=1.15"]
gcp   = ["google-cloud-functions>=1.13"]
dev   = ["pytest>=7.4", "pytest-cov>=4.1", "flake8>=7.0"]

[project.scripts]
factory = "factory.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
