# bot.yaml – AI Jarvis Assistant Template
#
# This manifest defines the components and configuration for an
# executive-assistant style bot generated by Factory.ai.

name: AIJarvisAssistantBot
version: "1.0.0"
description: >
  An AI assistant bot that manages briefings, follow-ups, task coordination,
  and escalations for a fast-moving operator or team.

components:
  nlp:
    module: components.nlp.text_processor
    intents:
      greeting:   ["hello", "hi", "hey", "good morning", "good evening"]
      briefing:   ["brief me", "summary", "recap", "overview", "update me"]
      follow_up:  ["follow up", "remind", "check in", "nudge", "ping"]
      status:     ["status", "progress", "what's happening", "report", "check"]
      schedule:   ["schedule", "calendar", "book", "meeting", "plan"]
      escalate:   ["escalate", "manager", "urgent", "priority", "handoff"]

  memory:
    module: components.memory.state_store
    ttl_seconds: 14400

  decision:
    module: components.decision.rule_engine
    rules:
      - condition: "intent == 'briefing'"
        action:    "prepare_briefing"
      - condition: "intent == 'follow_up'"
        action:    "create_follow_up_task"
      - condition: "intent == 'schedule'"
        action:    "coordinate_schedule"
      - condition: "intent == 'status'"
        action:    "report_status"
      - condition: "intent == 'escalate'"
        action:    "escalate_request"
      - condition: "intent == 'greeting'"
        action:    "send_canned_response"

extensions: []

integrations:
  allbots:
    enabled: true
    queue:   "jarvis-assistant-queue"
  aws:
    enabled: false
  azure:
    enabled: false
  gcp:
    enabled: false

deployment:
  target: allbots
  replicas: 1
  environment:
    LOG_LEVEL: "INFO"
    ASSISTANT_MODE: "executive"
