# bot.yaml – Engineer Manager Template
#
# This manifest defines the components and configuration for an
# engineering-manager bot generated by Factory.ai.

name: EngineerManagerBot
version: "1.0.0"
description: >
  An AI engineering manager bot that coordinates prioritization, delivery
  tracking, blockers, incidents, and team escalations.

components:
  nlp:
    module: components.nlp.text_processor
    intents:
      planning:   ["plan", "roadmap", "scope", "estimate", "prioritize"]
      status:     ["status", "progress", "delivery", "timeline", "update"]
      blocker:    ["blocked", "blocker", "stuck", "dependency", "risk"]
      incident:   ["incident", "outage", "bug", "sev", "hotfix"]
      coaching:   ["feedback", "coach", "mentor", "performance", "support"]
      escalate:   ["escalate", "urgent", "director", "executive", "critical"]

  memory:
    module: components.memory.state_store
    ttl_seconds: 10800

  decision:
    module: components.decision.rule_engine
    rules:
      - condition: "intent == 'planning'"
        action:    "plan_delivery_work"
      - condition: "intent == 'status'"
        action:    "report_delivery_status"
      - condition: "intent == 'blocker'"
        action:    "resolve_or_route_blocker"
      - condition: "intent == 'incident'"
        action:    "coordinate_incident_response"
      - condition: "intent == 'coaching'"
        action:    "prepare_coaching_follow_up"
      - condition: "intent == 'escalate'"
        action:    "escalate_to_leadership"

extensions: []

integrations:
  allbots:
    enabled: true
    queue:   "engineer-manager-queue"
  aws:
    enabled: false
  azure:
    enabled: false
  gcp:
    enabled: false

deployment:
  target: allbots
  replicas: 1
  environment:
    LOG_LEVEL: "INFO"
    INCIDENT_ESCALATION_MODE: "enabled"
