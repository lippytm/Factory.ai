# bot.yaml – Communications Manager Template
#
# This manifest defines the components and configuration for a
# communications-manager bot generated by Factory.ai.

name: CommunicationsManagerBot
version: "1.0.0"
description: >
  An AI communications manager that triages messaging requests, drafts
  responses, routes approvals, and escalates sensitive issues.

components:
  nlp:
    module: components.nlp.text_processor
    intents:
      announcement: ["announce", "announcement", "launch", "publish", "share"]
      response:     ["reply", "respond", "answer", "message back", "draft response"]
      briefing:     ["briefing", "talking points", "prep", "statement", "summary"]
      crisis:       ["crisis", "urgent", "sensitive", "incident", "reputation"]
      review:       ["review", "approve", "edit", "polish", "revise"]

  memory:
    module: components.memory.state_store
    ttl_seconds: 7200

  decision:
    module: components.decision.rule_engine
    rules:
      - condition: "intent == 'crisis'"
        action:    "escalate_to_human_review"
      - condition: "intent == 'announcement'"
        action:    "draft_announcement"
      - condition: "intent == 'response'"
        action:    "draft_response"
      - condition: "intent == 'briefing'"
        action:    "prepare_talking_points"
      - condition: "intent == 'review'"
        action:    "revise_message"

extensions: []

integrations:
  allbots:
    enabled: true
    queue:   "communications-manager-queue"
  aws:
    enabled: false
  azure:
    enabled: false
  gcp:
    enabled: false

deployment:
  target: allbots
  replicas: 1
  environment:
    LOG_LEVEL: "INFO"
    APPROVAL_REQUIRED_FOR_SENSITIVE: "true"
