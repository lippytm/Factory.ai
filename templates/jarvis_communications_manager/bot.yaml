# bot.yaml – Jarvis Communications Manager Template
#
# This manifest defines the components and configuration for an
# engineering-manager communications assistant generated by Factory.ai.

name: JarvisCommunicationsManager
version: "1.0.0"
description: >
  An AI communications manager that helps engineering leaders draft status
  updates, stakeholder briefings, meeting follow-ups, and incident
  communications with consistent routing and context retention.

# ── Components ────────────────────────────────────────────────────────────────
components:
  nlp:
    module: components.nlp.text_processor
    intents:
      status_update: ["status update", "weekly update", "progress report", "summary"]
      stakeholder_brief: ["stakeholder", "leadership", "executive", "briefing"]
      incident_update: ["incident", "outage", "postmortem", "sev", "degradation"]
      meeting_followup: ["follow-up", "meeting notes", "action items", "recap"]
      escalate: ["urgent", "escalate", "manager", "communications support"]

  memory:
    module: components.memory.state_store
    ttl_seconds: 7200       # retain active communication context for 2 hours

  decision:
    module: components.decision.rule_engine
    rules:
      - condition: "intent == 'incident_update'"
        action:    "open_incident_communications_flow"
      - condition: "intent == 'stakeholder_brief'"
        action:    "draft_stakeholder_brief"
      - condition: "intent == 'meeting_followup'"
        action:    "draft_meeting_followup"
      - condition: "intent == 'status_update'"
        action:    "draft_status_update"
      - condition: "intent == 'escalate'"
        action:    "route_to_human_communications_lead"

# ── Extensions ────────────────────────────────────────────────────────────────
extensions: []

# ── Integrations ──────────────────────────────────────────────────────────────
integrations:
  allbots:
    enabled: true
    queue:   "jarvis-comms-queue"
  slack:
    enabled: false          # enable and configure for stakeholder notifications
  email:
    enabled: false          # enable and configure for distribution workflows

# ── Deployment ────────────────────────────────────────────────────────────────
deployment:
  target: allbots           # allbots | aws | azure | gcp
  replicas: 1
  environment:
    LOG_LEVEL: "INFO"
    DEFAULT_AUDIENCE: "engineering"
